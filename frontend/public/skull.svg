<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd24d"/>
      <stop offset="100%" style="stop-color:#e6a800"/>
    </linearGradient>
  </defs>
  <g transform="translate(10, 10)">
    <!-- Skull -->
    <path d="M40 5 C60 5 75 20 75 40 C75 55 70 65 60 70 L60 80 L50 85 L30 85 L20 80 L20 70 C10 65 5 55 5 40 C5 20 20 5 40 5Z" fill="url(#goldGradient)"/>
    <!-- Left Eye -->
    <ellipse cx="25" cy="35" rx="8" ry="10" fill="#001a33"/>
    <!-- Right Eye -->
    <ellipse cx="55" cy="35" rx="8" ry="10" fill="#001a33"/>
    <!-- Nose -->
    <path d="M40 50 L35 60 L45 60 Z" fill="#001a33"/>
    <!-- Teeth -->
    <path d="M25 70 L25 80 L30 75 L35 80 L40 75 L45 80 L50 75 L55 80 L55 70 Z" fill="#001a33"/>
    <!-- Crossbones behind -->
    <path d="M-5 75 L85 20" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-5 20 L85 75" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
